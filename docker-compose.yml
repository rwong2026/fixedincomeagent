services:
  fixedincomeagent:
    build: .
    env_file:
      - .env
    volumes:
      - fixedincomeagent_data:/home/appuser/.fixedincomeagent
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  fixedincomeagent-ollama:
    build: .
    env_file:
      - .env
    environment:
      - FIXEDINCOMEAGENT_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - fixedincomeagent_data:/home/appuser/.fixedincomeagent
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  fixedincomeagent_data:
  ollama_data:
